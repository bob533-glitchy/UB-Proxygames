<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TLD GAMES</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #proxyFrame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: white;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      z-index: 10;
    }

    #error {
      display: none;
      text-align: center;
      padding: 30px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading">Loading TLD GAMES...</div>

  <iframe
    id="proxyFrame"
    title="TLD GAMES"
    allow="fullscreen; autoplay; gamepad; clipboard-read; clipboard-write"
    referrerpolicy="no-referrer">
  </iframe>

  <div id="error"></div>

  <script src="/uv/uv.bundle.js"></script>
  <script src="/uv/uv.config.js"></script>
  <script src="/script.js"></script>
</body>
</html>
